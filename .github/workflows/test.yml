name: Go

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'
        cache-dependency-path: halo/go.sum
    
    - name: Run tests with coverage
      working-directory: ./halo
      env:
        TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      run: |
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
    
    - name: Display coverage summary
      working-directory: ./halo
      run: |
        echo "=== Test Coverage Summary ==="
        go tool cover -func=coverage.out
        echo ""
        echo "=== Total Coverage ==="
        go tool cover -func=coverage.out | grep total | awk '{print "Total Coverage: " $3}'
    
    - name: Generate coverage table for GitHub UI
      working-directory: ./halo
      run: |
        # Get total coverage
        TOTAL_COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
        
        # Start building the markdown summary
        echo "## 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Overall Coverage: **${TOTAL_COV}**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage by Package/File" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| File | Function | Coverage |" >> $GITHUB_STEP_SUMMARY
        echo "|------|----------|----------|" >> $GITHUB_STEP_SUMMARY
        
        # Parse coverage output and create table rows (exclude the total line)
        go tool cover -func=coverage.out | grep -v "^total:" | awk '{printf "| `%s` | `%s` | %s |\n", $1, $2, $3}' >> $GITHUB_STEP_SUMMARY
        
        # Save coverage report for PR comment
        echo "## 📊 Test Coverage Report" > coverage-report.md
        echo "" >> coverage-report.md
        echo "### Overall Coverage: **${TOTAL_COV}**" >> coverage-report.md
        echo "" >> coverage-report.md
        echo "### Coverage by Package/File" >> coverage-report.md
        echo "" >> coverage-report.md
        echo "| File | Function | Coverage |" >> coverage-report.md
        echo "|------|----------|----------|" >> coverage-report.md
        go tool cover -func=coverage.out | grep -v "^total:" | awk '{printf "| `%s` | `%s` | %s |\n", $1, $2, $3}' >> coverage-report.md
    
    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        path: halo/coverage-report.md
        recreate: true
    
    - name: Generate HTML coverage report
      working-directory: ./halo
      run: |
        go tool cover -html=coverage.out -o coverage.html
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: halo/coverage.html
        retention-days: 90

